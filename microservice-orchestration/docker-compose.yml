services:

  # LOGIN: DB + API
  login-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - login-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - labnet

  login-service:
    image: ghcr.io/tremainm/ci-cd_y4-bankingapp_login/login:latest
    ports:
      - "8001:8000"
    environment:
      APP_ENV: docker
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
      # FIX: login image has psycopg2-binary, so use psycopg2 driver
      DATABASE_URL: postgresql+psycopg2://app:app@login-db:5432/appdb
      # FIX: point to the account service by its compose service name
      OTHER_API_BASE: http://account-service:8000
    depends_on:
      login-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - labnet

  # ACCOUNT: DB + API
  account-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - account-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - labnet

  account-service:
    image: ghcr.io/nokuvimba/account-microservice/account:latest
    ports:
      - "8002:8000"
    environment:
      APP_ENV: docker
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
      SQL_ECHO: "false"
      #using psycopg2 here too (safe + consistent), and point to account-db
      DATABASE_URL: postgresql+psycopg2://app:app@account-db:5432/appdb
      # point to the login service by its compose service name
      LOGIN_BASE_URL: http://login-service:8000
      OTHER_API_BASE: http://login-service:8000
    depends_on:
      account-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - labnet

  # NOTIFICATION: DB + API
  notification-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
    volumes:
      - notification-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      retries: 10
    restart: unless-stopped
    networks:
      - labnet

  notification-service:
    image: ghcr.io/tremainm/ci-cd_y4-bankingapp_notification/notification_service:latest
    ports:
      - "8004:8000"
    environment:
      APP_ENV: docker
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: appdb
      SQL_ECHO: "false"
      #using psycopg2 here too (safe + consistent), and point to notification-db
      DATABASE_URL: postgresql+psycopg2://app:app@notification-db:5432/appdb
      # point to the login service by its compose service name
    depends_on:
      notification-db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - labnet

volumes:
  login-postgres-data:
  account-postgres-data:
  notification-postgres-data:

networks:
  labnet: {}