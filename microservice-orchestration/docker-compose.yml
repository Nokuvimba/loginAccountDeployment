services:
  login-db:
    image: postgres:17-alpine
    env_file: ./login-microservice/.env.docker
    volumes:
      - login-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-app}\" -d \"$${POSTGRES_DB:-appdb}\""]
      interval: 5s
      retries: 10
    restart: unless-stopped

  login:
    build: ./login-microservice
    env_file: ./login-microservice/.env.docker
    environment:
      - APP_ENV=docker
      - ACCOUNT_BASE_URL=http://account:8000
    depends_on:
      login-db:
        condition: service_healthy
    ports:
      - "8001:8000"
    restart: unless-stopped

  account-db:
    image: postgres:17-alpine
    env_file: ./account-microservice/.env.docker
    volumes:
      - account-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-app}\" -d \"$${POSTGRES_DB:-appdb}\""]
      interval: 5s
      retries: 10
    restart: unless-stopped

  account:
    build: ./account-microservice
    env_file: ./account-microservice/.env.docker
    environment:
      - APP_ENV=docker
      - LOGIN_BASE_URL=http://login:8000
    depends_on:
      account-db:
        condition: service_healthy
    ports:
      - "8002:8000"
    restart: unless-stopped

volumes:
  login-postgres-data: {}
  account-postgres-data: {}
